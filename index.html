<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotalk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{cursor:pointer;font-family:inherit}
textarea{font-family:inherit}

/* ── Tokens ── */
:root{
  --bg:       #f6f3ef;
  --bg2:      #edeae5;
  --surface:  #ffffff;
  --sidebar:  #f0ece5;
  --border:   rgba(0,0,0,.08);
  --bstrong:  rgba(0,0,0,.13);
  --shadow:   0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.07);
  --shadow-lg:0 8px 32px rgba(0,0,0,.13),0 2px 8px rgba(0,0,0,.06);

  --accent:        #e05c3a;
  --accent-h:      #c94e2e;
  --accent-subtle: rgba(224,92,58,.1);

  --text:   #1a1714;
  --text2:  #5c5650;
  --text3:  #9c9590;
  --white:  #ffffff;
  --green:  #22c55e;
  --red:    #ef4444;
  --warn:   #f59e0b;

  --r-s:4px;--r-m:10px;--r-l:16px;--r-xl:22px;--r-f:999px;

  --font-d:'Bricolage Grotesque',sans-serif;
  --font-u:'DM Sans',sans-serif;

  --sidebar-w:268px;
}

/* ── Base ── */
html,body{height:100%;font-family:var(--font-u);color:var(--text);background:var(--bg)}
body{overflow:hidden}

/* ══════════════════════════════════════════
   SCREENS
══════════════════════════════════════════ */
.screen{width:100%;height:100dvh;display:none}
.screen.active{display:flex}

/* ══════════════════════════════════════════
   LOBBY
══════════════════════════════════════════ */
#s-lobby{
  align-items:center;
  justify-content:center;
  padding:1.5rem;
  background:var(--bg);
  position:relative;
  overflow:hidden;
}
/* ambient blobs */
#s-lobby::before,#s-lobby::after{
  content:'';position:absolute;border-radius:50%;
  filter:blur(90px);opacity:.3;pointer-events:none;
}
#s-lobby::before{
  width:520px;height:520px;
  background:radial-gradient(#f5a07080,transparent 70%);
  top:-140px;right:-120px;
}
#s-lobby::after{
  width:420px;height:420px;
  background:radial-gradient(#a0d8cf80,transparent 70%);
  bottom:-100px;left:-100px;
}

.lobby-inner{
  display:flex;gap:3.5rem;align-items:center;
  width:100%;max-width:860px;z-index:1;
}

/* Left copy */
.lobby-copy{flex:1;display:flex;flex-direction:column;gap:1.4rem}

.brand{display:flex;align-items:center;gap:.55rem}
.brand-mark{
  width:38px;height:38px;border-radius:10px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(224,92,58,.35);
  flex-shrink:0;
}
.brand-mark svg{width:20px;height:20px;fill:#fff}
.brand-name{font-family:var(--font-d);font-size:1.25rem;font-weight:700;letter-spacing:-.02em}

.lobby-h1{
  font-family:var(--font-d);
  font-size:clamp(1.8rem,4.5vw,2.8rem);
  font-weight:700;line-height:1.1;letter-spacing:-.03em;
}
.lobby-h1 em{color:var(--accent);font-style:normal}

.lobby-desc{font-size:.92rem;color:var(--text2);line-height:1.75;max-width:320px}

/* Card */
.lobby-card{
  background:var(--surface);border-radius:var(--r-xl);
  padding:2.2rem 2.4rem;
  width:100%;max-width:390px;flex-shrink:0;
  border:1px solid var(--border);
  box-shadow:var(--shadow-lg);
  animation:cardUp .45s cubic-bezier(.2,.8,.4,1) both;
}
@keyframes cardUp{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

.card-h2{font-family:var(--font-d);font-size:1.2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:1.5rem}

/* Form field */
.field{display:flex;flex-direction:column;gap:.38rem;margin-bottom:.9rem}
.field label{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
.field input{
  font-size:.95rem;padding:.68rem .9rem;
  background:var(--bg);border:1.5px solid var(--bstrong);border-radius:var(--r-m);
  color:var(--text);outline:none;
  transition:border-color .18s,box-shadow .18s,background .18s;
}
.field input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-subtle)}
.field input::placeholder{color:var(--text3)}
.field .ferr{font-size:.76rem;color:var(--red);display:none}
.field .ferr.show{display:block}

/* Buttons */
.btn{
  width:100%;padding:.74rem 1rem;border-radius:var(--r-m);border:none;
  font-size:.9rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:.45rem;
  transition:all .15s;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(224,92,58,.28)}
.btn-primary:hover:not(:disabled){background:var(--accent-h);box-shadow:0 4px 16px rgba(224,92,58,.38);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* ── URL-param banner ── */
.room-prefill{
  display:none;
  background:var(--bg2);border:1.5px solid var(--bstrong);border-radius:var(--r-m);
  padding:.7rem .9rem;margin-bottom:1rem;
  font-size:.85rem;color:var(--text2);
}
.room-prefill.show{display:flex;align-items:center;gap:.6rem}
.room-prefill strong{color:var(--text);font-weight:600;letter-spacing:.06em}
.rpf-icon{font-size:1rem;flex-shrink:0}

/* ══════════════════════════════════════════
   CHAT
══════════════════════════════════════════ */
#s-chat{flex-direction:row}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}

.sb-top{
  padding:1rem 1.1rem .85rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.5rem;
}
.sb-brand-mark{
  width:28px;height:28px;border-radius:7px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sb-brand-mark svg{width:15px;height:15px;fill:#fff}
.sb-brand-name{font-family:var(--font-d);font-size:.95rem;font-weight:700;letter-spacing:-.02em;flex:1}
.sb-close{
  display:none;background:transparent;border:none;
  color:var(--text3);padding:.2rem;border-radius:var(--r-s);
  transition:background .15s,color .15s;
}
.sb-close:hover{background:var(--bg2);color:var(--text)}
.sb-close svg{width:18px;height:18px;display:block}

/* Room block */
.sb-section{padding:.85rem 1.1rem .5rem}
.sb-label{font-size:.67rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:.55rem}

.room-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);
  padding:.75rem .85rem;
}
.room-card-label{font-size:.75rem;font-weight:500;color:var(--text3);margin-bottom:.35rem}
.room-code-row{
  display:flex;align-items:center;gap:.5rem;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-s);
  padding:.38rem .5rem .38rem .65rem;
  cursor:pointer;transition:background .15s;user-select:none;
}
.room-code-row:hover{background:var(--bg)}
.room-code-val{
  font-size:.98rem;font-weight:700;letter-spacing:.14em;
  color:var(--accent);flex:1;
}
.copy-chip{
  font-size:.67rem;font-weight:600;letter-spacing:.03em;
  background:var(--accent);color:#fff;border:none;border-radius:5px;
  padding:.2rem .5rem;transition:background .15s;flex-shrink:0;
}
.copy-chip:hover{background:var(--accent-h)}
.room-share-note{font-size:.7rem;color:var(--text3);margin-top:.38rem}
.room-note{font-weight:400;letter-spacing:0;text-transform:none}
.room-input{text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.member-count{font-weight:400;font-size:.7rem;color:var(--text3)}
.msg-time-self{font-size:.68rem;color:var(--text3);text-align:right;padding-right:.3rem;margin-bottom:.22rem}

/* Members */
.sb-members{flex:1;overflow-y:auto;padding:0 1.1rem .8rem}
.sb-members::-webkit-scrollbar{width:3px}
.sb-members::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.member-row{display:flex;align-items:center;gap:.55rem;padding:.35rem 0}
.m-av{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.68rem;font-weight:700;color:#fff;flex-shrink:0;
  position:relative;
}
.m-av::after{
  content:'';position:absolute;bottom:0;right:0;
  width:8px;height:8px;border-radius:50%;
  background:var(--green);border:1.5px solid var(--sidebar);
}
.m-name{font-size:.83rem;font-weight:500;color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-name.me{color:var(--text);font-weight:600}
.m-you{font-size:.65rem;font-weight:600;color:var(--accent);background:rgba(224,92,58,.1);border-radius:var(--r-f);padding:.1rem .42rem;flex-shrink:0}

/* Sidebar footer */
.sb-footer{
  padding:.75rem 1.1rem;
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:.55rem;
}
.sb-my-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.73rem;font-weight:700;color:#fff;flex-shrink:0}
.sb-my-name{font-size:.85rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leave-btn{
  background:transparent;border:1px solid var(--bstrong);border-radius:var(--r-s);
  font-size:.73rem;font-weight:500;color:var(--text3);
  padding:.28rem .6rem;white-space:nowrap;
  transition:all .15s;
}
.leave-btn:hover{color:var(--red);border-color:var(--red);background:#fef2f2}

/* ── Main area ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface)}

/* Header */
.main-head{
  height:56px;padding:0 1.3rem;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  border-bottom:1px solid var(--border);
}
.head-left{display:flex;align-items:center;gap:.65rem;min-width:0}
.menu-btn{
  display:none;background:transparent;border:none;border-radius:var(--r-s);
  color:var(--text2);padding:.28rem;
  transition:background .15s;
}
.menu-btn:hover{background:var(--bg2)}
.menu-btn svg{width:20px;height:20px;display:block}
.head-room{font-family:var(--font-d);font-size:.97rem;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Connection badge */
.conn{display:flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:500;color:var(--text3);flex-shrink:0}
.conn-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.conn.online{color:var(--green)}
.conn.error{color:var(--red)}
.conn.connecting{color:var(--warn);animation:connPulse 1.2s infinite}
@keyframes connPulse{0%,100%{opacity:1}50%{opacity:.45}}

/* Messages */
#messages{
  flex:1;overflow-y:auto;
  padding:1rem 1.3rem 0;
  display:flex;flex-direction:column;
}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-track{background:transparent}
#messages::-webkit-scrollbar-thumb{background:var(--bg2);border-radius:3px}
#messages::-webkit-scrollbar-thumb:hover{background:var(--bstrong)}

/* Empty state */
.empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.75rem;padding-bottom:4rem;
  pointer-events:none;
}
.empty-icon{font-size:2rem}
.empty-t{font-family:var(--font-d);font-size:1rem;font-weight:700;letter-spacing:-.01em}
.empty-s{font-size:.82rem;color:var(--text3);text-align:center;max-width:200px;line-height:1.55}

/* ── Message groups ── */
/*
  Layout:
    Others: [av] name · time
                bubble
                bubble
    Self:           bubble  ← right-aligned, no avatar/name
                    bubble
*/
.msg-group{
  display:flex;flex-direction:column;
  margin-bottom:.1rem;
  animation:msgIn .22s cubic-bezier(.2,.8,.4,1) both;
}
.msg-group+.msg-group{margin-top:.6rem}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* group header (other only) */
.msg-head{
  display:flex;align-items:center;gap:.5rem;
  margin-bottom:.28rem;
  padding-left:.5rem;
}
.msg-av{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.64rem;font-weight:700;color:#fff;flex-shrink:0;
}
.msg-who{font-size:.79rem;font-weight:600;color:var(--text)}
.msg-when{font-size:.7rem;color:var(--text3);font-weight:400}

/* Bubbles wrapper — other */
.msg-bubbles{
  display:flex;flex-direction:column;gap:2px;
  padding-left:calc(26px + .5rem + .5rem); /* av-width + head-gap + indent */
  align-items:flex-start;
}
/* Bubbles wrapper — self */
.msg-bubbles.self{
  padding-left:4rem;
  padding-right:0;
  align-items:flex-end;
}

.bubble{
  display:inline-flex;
  width:fit-content;
  max-width:min(100%, 42ch);
  padding:.5rem .85rem;
  font-size:.9rem;line-height:1.56;
  word-break:break-word;white-space:pre-wrap;
  align-self:flex-start;
}
/* other bubble */
.msg-bubbles:not(.self) .bubble{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  border-radius:var(--r-l);
}
.msg-bubbles:not(.self) .bubble:first-child{border-top-left-radius:var(--r-s)}
.msg-bubbles:not(.self) .bubble:last-child{border-bottom-left-radius:var(--r-l)}
.msg-bubbles:not(.self) .bubble:not(:first-child):not(:last-child){border-top-left-radius:var(--r-s);border-bottom-left-radius:var(--r-s)}

/* self bubble */
.msg-bubbles.self .bubble{
  background:var(--text);color:#fff;
  border-radius:var(--r-l);
  align-self:flex-end;
}
.msg-bubbles.self .bubble:first-child{border-top-right-radius:var(--r-s)}
.msg-bubbles.self .bubble:last-child{border-bottom-right-radius:var(--r-l)}
.msg-bubbles.self .bubble:not(:first-child):not(:last-child){border-top-right-radius:var(--r-s);border-bottom-right-radius:var(--r-s)}

/* System message */
.sys{
  text-align:center;padding:.45rem 0;
  animation:msgIn .25s ease both;
}
.sys span{
  display:inline-block;font-size:.73rem;font-weight:500;
  background:var(--bg2);color:var(--text3);
  border-radius:var(--r-f);padding:.2rem .9rem;
  border:1px solid var(--border);
}
.sys.join span{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}

/* Scroll-to-bottom */
.scroll-btn{
  position:absolute;bottom:90px;right:1.3rem;
  width:36px;height:36px;border-radius:50%;
  background:var(--surface);border:1px solid var(--bstrong);
  box-shadow:var(--shadow);
  display:none;align-items:center;justify-content:center;
  color:var(--text2);
  transition:all .15s;z-index:5;
}
.scroll-btn.show{display:flex}
.scroll-btn:hover{background:var(--bg2);transform:translateY(-1px)}
.scroll-btn svg{width:16px;height:16px}

/* ── Input ── */
.input-area{
  padding:.85rem 1.3rem;
  border-top:1px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.input-box{
  display:flex;align-items:flex-end;gap:.55rem;
  background:var(--bg);
  border:1.5px solid var(--bstrong);border-radius:var(--r-xl);
  padding:.38rem .38rem .38rem .85rem;
  transition:border-color .18s,box-shadow .18s,background .18s;
}
.input-box:focus-within{
  border-color:var(--accent);
  background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-subtle);
}
#msg-input{
  flex:1;background:transparent;border:none;outline:none;
  font-size:.92rem;color:var(--text);
  resize:none;height:34px;max-height:110px;
  line-height:1.5;padding-top:.32rem;
}
#msg-input::placeholder{color:var(--text3)}
#msg-input:disabled{opacity:.5}

.send{
  width:34px;height:34px;border-radius:var(--r-m);border:none;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 6px rgba(224,92,58,.28);
  transition:all .15s;
}
.send:hover:not(:disabled){background:var(--accent-h);box-shadow:0 3px 10px rgba(224,92,58,.36)}
.send:disabled{background:var(--bg2);box-shadow:none;cursor:not-allowed}
.send svg{width:15px;height:15px;fill:#fff;display:block}
.send:disabled svg{fill:var(--text3)}

.input-hint{font-size:.7rem;color:var(--text3);text-align:right;margin-top:.32rem;padding-right:.3rem}

/* ── Toast ── */
.toasts{
  position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column-reverse;align-items:center;gap:.4rem;
  z-index:999;pointer-events:none;
}
.toast{
  background:var(--text);color:#fff;
  font-size:.8rem;font-weight:500;
  padding:.5rem 1.1rem;border-radius:var(--r-f);
  box-shadow:0 4px 14px rgba(0,0,0,.2);
  opacity:0;transform:translateY(6px) scale(.95);
  transition:all .22s cubic-bezier(.2,.8,.4,1);
  white-space:nowrap;
}
.toast.on{opacity:1;transform:none}

/* ── Overlay (mobile) ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.28);backdrop-filter:blur(2px);
  z-index:39;
}
.overlay.show{display:block}

/* ── Mobile ── */
@media(max-width:620px){
  .lobby-inner{flex-direction:column;gap:1.8rem}
  .lobby-copy{align-items:center;text-align:center}
  .lobby-desc{max-width:none}
  .lobby-card{max-width:none;padding:1.8rem 1.5rem}

  .sidebar{
    position:fixed;inset:0 auto 0 0;
    width:min(var(--sidebar-w),82vw);
    z-index:40;transform:translateX(-100%);
  }
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .sb-close{display:flex;align-items:center;justify-content:center}
  .menu-btn{display:flex}
}
</style>
</head>
<body>

<!-- ══════════ LOBBY ══════════ -->
<div id="s-lobby" class="screen active">
  <div class="lobby-inner">

    <!-- Copy -->
    <div class="lobby-copy">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l4.93-1.38A9.93 9.93 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
        </div>
        <span class="brand-name">Cotalk</span>
      </div>
      <h1 class="lobby-h1">誰とでも<br><em>リアルタイム</em>で話そう</h1>
      <p class="lobby-desc">インストール・サインアップ不要。ルームIDを共有するだけで今すぐ話せます。</p>
    </div>

    <!-- Card -->
    <div class="lobby-card">
      <div class="card-h2">チャットを始める</div>

      <!-- room pre-fill banner (shown when ?room= param exists) -->
      <div class="room-prefill" id="rpf-banner">
        <span class="rpf-icon">🔗</span>
        <span>ルームID: <strong id="rpf-code"></strong></span>
      </div>

      <div class="field">
        <label>ユーザー名</label>
        <input id="inp-name" type="text" placeholder="あなたの名前" maxlength="18" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <span class="ferr" id="err-name">ユーザー名を入力してください</span>
      </div>

      <div class="field">
        <label>ルームID <span class="room-note">(空欄で自動生成)</span></label>
        <input id="inp-room" class="room-input" type="text" placeholder="例: COTALK" maxlength="10" autocomplete="off" autocorrect="off" spellcheck="false"/>
      </div>

      <button type="button" class="btn btn-primary" id="join-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>

<script>
/* ═══════════════════════════════════════════
   Config
═══════════════════════════════════════════ */
const BROKER = 'wss://broker.hivemq.com:8884/mqtt';
const TOPIC_PFX = 'cotalk/';
const PROFILE_STORAGE_KEY = 'cotalk.profile.v1';
const MESSAGE_GROUP_WINDOW = 90_000;
const MAX_ROOM_LENGTH = 10;
const MAX_NAME_LENGTH = 18;
const MAX_MESSAGE_LENGTH = 1000;

const AV_COLORS = [
  '#e05c3a', '#3b82f6', '#8b5cf6', '#ec4899',
  '#10b981', '#f59e0b', '#06b6d4', '#6366f1',
  '#f97316', '#14b8a6', '#84cc16', '#a855f7',
];

/* ═══════════════════════════════════════════
   State
═══════════════════════════════════════════ */
const state = {
  client: null,
  me: { name: '', cid: '', color: '' },
  room: '',
  members: new Map(),
  lastGroup: { cid: null, el: null, ts: 0 },
  userScrolled: false,
};

const dom = {};

/* ═══════════════════════════════════════════
   DOM helpers
═══════════════════════════════════════════ */
function $(id) { return document.getElementById(id); }

function cacheDom() {
  dom.lobby = $('s-lobby');
  dom.chat = $('s-chat');
  dom.rpfBanner = $('rpf-banner');
  dom.rpfCode = $('rpf-code');
  dom.inpName = $('inp-name');
  dom.inpRoom = $('inp-room');
  dom.errName = $('err-name');
  dom.joinBtn = $('join-btn');
  dom.overlay = $('overlay');
  dom.sidebar = $('sidebar');
  dom.sbClose = $('sb-close');
  dom.roomCard = $('room-card');
  dom.sbRoomCode = $('sb-room-code');
  dom.memberList = $('member-list');
  dom.memberCount = $('member-count');
  dom.myAv = $('my-av');
  dom.myName = $('my-name');
  dom.leaveBtn = $('leave-btn');
  dom.menuBtn = $('menu-btn');
  dom.messages = $('messages');
  dom.empty = $('empty');
  dom.scrollBtn = $('scroll-btn');
  dom.msgInput = $('msg-input');
  dom.sendBtn = $('send-btn');
  dom.conn = $('conn');
  dom.connTxt = $('conn-txt');
  dom.headRoom = $('head-room');
  dom.toasts = $('toasts');
}

function createEl(tag, { className = '', text = '', attrs = {}, style = {} } = {}, children = []) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== '') node.textContent = text;
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined) continue;
    node.setAttribute(key, String(value));
  }
  Object.assign(node.style, style);
  for (const child of children) {
    if (child) node.appendChild(child);
  }
  return node;
}

/* ═══════════════════════════════════════════
   Storage & validation
═══════════════════════════════════════════ */
function readProfile() {
  try {
    const parsed = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || '{}');
    return typeof parsed === 'object' && parsed ? parsed : {};
  } catch {
    return {};
  }
}

function writeProfile(patch) {
  try {
    const current = readProfile();
    const next = { ...current, ...patch };
    localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(next));
  } catch {
    // localStorage unavailable or full; fail silently.
  }
}

function sanitizeName(value) {
  return String(value ?? '')
    .replace(/[\u0000-\u001F\u007F]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, MAX_NAME_LENGTH);
}

function sanitizeRoom(value) {
  return String(value ?? '')
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, '')
    .slice(0, MAX_ROOM_LENGTH);
}

function normalizeClientId(value) {
  const cleaned = String(value ?? '')
    .replace(/[^A-Za-z0-9_-]/g, '')
    .slice(0, 32);
  return cleaned || '';
}

function isSafeHexColor(value) {
  return typeof value === 'string' && /^#[0-9A-Fa-f]{6}$/.test(value);
}

function safeColor(value, fallback) {
  return isSafeHexColor(value) ? value : fallback;
}

function uid(length = 10) {
  return Math.random().toString(36).slice(2, 2 + length).toUpperCase();
}

function avColor(name) {
  let hash = 0;
  for (const ch of String(name || '')) hash = (hash * 31 + ch.charCodeAt(0)) | 0;
  return AV_COLORS[Math.abs(hash) % AV_COLORS.length];
}

function avInitials(name) {
  const trimmed = String(name || '').trim();
  return (trimmed ? trimmed.slice(0, 2) : '?').toUpperCase();
}

function fmtTime(ts) {
  return new Date(ts || Date.now()).toLocaleTimeString('ja-JP', {
    hour: '2-digit',
    minute: '2-digit',
  });
}

function normalizeText(value, limit = MAX_MESSAGE_LENGTH) {
  return String(value ?? '').replace(/[\u0000-\u001F\u007F]/g, '').slice(0, limit);
}

/* ═══════════════════════════════════════════
   UI feedback
═══════════════════════════════════════════ */
function toast(message, ms = 2600) {
  const el = createEl('div', { className: 'toast', text: message });
  dom.toasts.appendChild(el);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => el.classList.add('on'));
  });
  setTimeout(() => {
    el.classList.remove('on');
    setTimeout(() => el.remove(), 320);
  }, ms);
}

function setConnectionState(stateName, label) {
  dom.conn.className = `conn${stateName ? ` ${stateName}` : ''}`;
  dom.connTxt.textContent = label;
}

function scrollToBottom(behavior = 'smooth') {
  dom.messages.scrollTo({ top: dom.messages.scrollHeight, behavior });
  state.userScrolled = false;
  dom.scrollBtn.classList.remove('show');
}

function syncSendButton() {
  const hasText = Boolean(dom.msgInput.value.trim());
  dom.sendBtn.disabled = !hasText || !state.client?.connected;
}

function setSidebarOpen(open) {
  dom.sidebar.classList.toggle('open', open);
  dom.overlay.classList.toggle('show', open);
}

function showJoinError(show) {
  dom.errName.classList.toggle('show', show);
}

function setComposerEnabled(enabled) {
  dom.msgInput.disabled = !enabled;
  if (!enabled) {
    dom.sendBtn.disabled = true;
  } else {
    syncSendButton();
  }
}

function setEmptyStateVisible(visible) {
  if (visible) {
    if (!dom.empty.isConnected) dom.messages.prepend(dom.empty);
    return;
  }
  if (dom.empty.isConnected) dom.empty.remove();
}

/* ═══════════════════════════════════════════
   Initialization
═══════════════════════════════════════════ */
function restoreProfile() {
  const profile = readProfile();
  const savedName = sanitizeName(profile.name);
  const savedCid = normalizeClientId(profile.cid);
  const savedColor = safeColor(profile.color, '');

  if (savedName) dom.inpName.value = savedName;
  state.me.name = savedName;
  state.me.cid = savedCid;
  state.me.color = savedColor;
}

function applyRoomFromQuery() {
  const params = new URLSearchParams(location.search);
  const room = sanitizeRoom(params.get('room'));

  if (room) {
    dom.inpRoom.value = room;
    dom.rpfCode.textContent = room;
    dom.rpfBanner.classList.add('show');
  } else {
    dom.rpfBanner.classList.remove('show');
  }
}

function bindEvents() {
  dom.inpName.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      dom.inpRoom.focus();
    }
  });

  dom.inpRoom.addEventListener('input', () => {
    const next = sanitizeRoom(dom.inpRoom.value);
    if (dom.inpRoom.value !== next) dom.inpRoom.value = next;
  });

  dom.inpRoom.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      joinChat();
    }
  });

  dom.joinBtn.addEventListener('click', joinChat);
  dom.leaveBtn.addEventListener('click', leaveChat);
  dom.menuBtn.addEventListener('click', () => setSidebarOpen(true));
  dom.sbClose.addEventListener('click', () => setSidebarOpen(false));
  dom.overlay.addEventListener('click', () => setSidebarOpen(false));
  dom.scrollBtn.addEventListener('click', () => scrollToBottom());
  dom.msgInput.addEventListener('input', handleMessageInput);
  dom.msgInput.addEventListener('keydown', handleMessageKeydown);
  dom.roomCard.addEventListener('click', copyRoomLink);

  dom.messages.addEventListener('scroll', handleMessageScroll);
  window.addEventListener('beforeunload', handleBeforeUnload);
}

function init() {
  cacheDom();
  bindEvents();
  restoreProfile();
  applyRoomFromQuery();
  dom.inpName.focus();
  syncSendButton();
}

/* ═══════════════════════════════════════════
   Join / leave
═══════════════════════════════════════════ */
function joinChat() {
  const name = sanitizeName(dom.inpName.value);
  if (!name) {
    showJoinError(true);
    dom.inpName.focus();
    return;
  }

  showJoinError(false);

  const room = sanitizeRoom(dom.inpRoom.value) || sanitizeRoom(uid(6));
  const profile = readProfile();
  const cid = normalizeClientId(profile.cid) || `u_${uid(12)}`;
  const color = safeColor(profile.color, '') || avColor(name);

  state.me = { name, cid, color };
  state.room = room;

  writeProfile({
    name: state.me.name,
    cid: state.me.cid,
    color: state.me.color,
  });

  openChatView();
  connectMQTT();
}

function openChatView() {
  dom.lobby.classList.remove('active');
  dom.chat.classList.add('active');

  dom.headRoom.textContent = `# ${state.room}`;
  dom.sbRoomCode.textContent = state.room;
  dom.myAv.textContent = avInitials(state.me.name);
  dom.myAv.style.background = state.me.color;
  dom.myName.textContent = state.me.name;

  state.members.clear();
  state.members.set(state.me.cid, { name: state.me.name, color: state.me.color });
  state.lastGroup = { cid: null, el: null, ts: 0 };
  renderMembers();
  setEmptyStateVisible(true);
}

function leaveChat() {
  if (state.client?.connected) {
    publishPacket({ type: 'leave', user: state.me.name });
  }

  closeClientSoon();
  resetMessages();
  state.members.clear();
  state.lastGroup = { cid: null, el: null, ts: 0 };

  dom.chat.classList.remove('active');
  dom.lobby.classList.add('active');
  dom.inpRoom.value = '';
  dom.rpfBanner.classList.remove('show');
  dom.inpName.focus();
  setConnectionState('', '');
}

function resetMessages() {
  dom.messages.replaceChildren();
  dom.empty = createEmptyState();
  dom.messages.appendChild(dom.empty);
}

function closeClientSoon() {
  const client = state.client;
  state.client = null;
  if (!client) return;
  setTimeout(() => {
    try {
      client.removeAllListeners?.();
      client.end(true);
    } catch {
      // Ignore shutdown issues.
    }
  }, 250);
}

/* ═══════════════════════════════════════════
   MQTT
═══════════════════════════════════════════ */
function connectMQTT() {
  setConnectionState('connecting', '接続中…');

  state.client = mqtt.connect(BROKER, {
    clientId: state.me.cid,
    clean: true,
    connectTimeout: 12000,
    reconnectPeriod: 4000,
    keepalive: 30,
  });

  const topic = TOPIC_PFX + state.room;

  state.client.on('connect', () => {
    setConnectionState('online', 'オンライン');
    state.client.subscribe(topic, { qos: 0 });
    publishPacket({ type: 'join', user: state.me.name, color: state.me.color });
    appendSystemMessage(`${state.me.name} として参加しました`, 'join');
    toast(`${state.room} に参加しました 🎉`);
    setComposerEnabled(true);
    requestAnimationFrame(() => dom.msgInput.focus());
  });

  state.client.on('reconnect', () => {
    setConnectionState('connecting', '再接続中…');
    setComposerEnabled(false);
  });

  state.client.on('error', () => {
    setConnectionState('error', '接続エラー');
    setComposerEnabled(false);
  });

  state.client.on('offline', () => {
    setConnectionState('error', 'オフライン');
    setComposerEnabled(false);
  });

  state.client.on('close', () => {
    if (state.client) {
      setConnectionState('error', '切断');
      setComposerEnabled(false);
    }
  });

  state.client.on('message', (_, buffer) => {
    try {
      const packet = normalizePacket(buffer.toString());
      if (!packet || packet.cid === state.me.cid) return;
      handlePacket(packet);
    } catch {
      // Ignore malformed packets.
    }
  });
}

function publishPacket(payload) {
  if (!state.client?.connected) return;
  const packet = {
    ...payload,
    cid: state.me.cid,
    ts: Date.now(),
  };
  state.client.publish(TOPIC_PFX + state.room, JSON.stringify(packet), { qos: 0 });
}

function normalizePacket(raw) {
  const data = JSON.parse(raw);
  if (!data || typeof data !== 'object' || Array.isArray(data)) return null;

  const type = typeof data.type === 'string' ? data.type : '';
  if (!['join', 'here', 'leave', 'msg'].includes(type)) return null;

  const cid = normalizeClientId(data.cid);
  if (!cid) return null;

  const user = sanitizeName(data.user);
  const text = normalizeText(data.text);
  const color = safeColor(data.color, '');
  const ts = Number.isFinite(Number(data.ts)) ? Number(data.ts) : Date.now();

  return { type, cid, user, text, color, ts };
}

function handlePacket(packet) {
  if (packet.type === 'join') {
    state.members.set(packet.cid, {
      name: packet.user || 'unknown',
      color: packet.color || avColor(packet.user || 'unknown'),
    });
    renderMembers();
    appendSystemMessage(`${packet.user || 'unknown'} が参加しました`, 'join');
    publishPacket({ type: 'here', user: state.me.name, color: state.me.color });
    return;
  }

  if (packet.type === 'here') {
    state.members.set(packet.cid, {
      name: packet.user || 'unknown',
      color: packet.color || avColor(packet.user || 'unknown'),
    });
    renderMembers();
    return;
  }

  if (packet.type === 'leave') {
    state.members.delete(packet.cid);
    renderMembers();
    appendSystemMessage(`${packet.user || 'unknown'} が退出しました`);
    return;
  }

  if (packet.type === 'msg') {
    appendMessage({
      cid: packet.cid,
      user: packet.user || 'unknown',
      text: packet.text,
      ts: packet.ts,
      self: false,
    });
  }
}

/* ═══════════════════════════════════════════
   Members
═══════════════════════════════════════════ */
function renderMembers() {
  const entries = [...state.members.entries()].sort(([cidA, a], [cidB, b]) => {
    if (cidA === state.me.cid) return -1;
    if (cidB === state.me.cid) return 1;
    return String(a.name).localeCompare(String(b.name), 'ja');
  });

  dom.memberList.replaceChildren();

  for (const [cid, member] of entries) {
    const isMe = cid === state.me.cid;
    const row = createEl('div', { className: 'member-row' });
    const avatar = createEl('div', {
      className: 'm-av',
      text: avInitials(member.name),
      style: { background: member.color || avColor(member.name) },
    });
    const name = createEl('span', {
      className: `m-name${isMe ? ' me' : ''}`,
      text: member.name,
    });

    row.append(avatar, name);
    if (isMe) row.append(createEl('span', { className: 'm-you', text: '自分' }));
    dom.memberList.appendChild(row);
  }

  dom.memberCount.textContent = `(${state.members.size})`;
}

/* ═══════════════════════════════════════════
   Messages
═══════════════════════════════════════════ */
function createEmptyState() {
  const wrapper = createEl('div', { className: 'empty', attrs: { id: 'empty' } });
  wrapper.append(
    createEl('div', { className: 'empty-icon', text: '💬' }),
    createEl('div', { className: 'empty-t', text: 'まだメッセージがありません' }),
    createEl('div', { className: 'empty-s', text: 'ルームIDを共有して友だちを招待しましょう' }),
  );
  return wrapper;
}

function ensureChatNotEmpty() {
  if (dom.empty.isConnected) dom.empty.remove();
}

function appendMessage({ cid, user, text, ts, self }) {
  ensureChatNotEmpty();

  const now = Number.isFinite(Number(ts)) ? Number(ts) : Date.now();
  const color = self ? state.me.color : (state.members.get(cid)?.color || avColor(user));
  const sameGroup = state.lastGroup.cid === cid && (now - state.lastGroup.ts) < MESSAGE_GROUP_WINDOW;

  if (sameGroup && state.lastGroup.el) {
    const bubbles = state.lastGroup.el.querySelector('.msg-bubbles');
    bubbles.appendChild(createEl('div', { className: 'bubble', text: normalizeText(text) }));
    state.lastGroup.ts = now;
    maybeScrollToBottom();
    return;
  }

  const group = createEl('div', { className: 'msg-group' });

  if (!self) {
    const head = createEl('div', { className: 'msg-head' });
    head.append(
      createEl('div', {
        className: 'msg-av',
        text: avInitials(user),
        style: { background: color },
      }),
      createEl('span', { className: 'msg-who', text: user }),
      createEl('span', { className: 'msg-when', text: fmtTime(now) }),
    );
    group.appendChild(head);
  } else {
    group.appendChild(createEl('div', { className: 'msg-time-self', text: fmtTime(now) }));
  }

  const bubbles = createEl('div', { className: `msg-bubbles${self ? ' self' : ''}` });
  bubbles.appendChild(createEl('div', { className: 'bubble', text: normalizeText(text) }));
  group.appendChild(bubbles);
  dom.messages.appendChild(group);

  state.lastGroup = { cid, el: group, ts: now };
  maybeScrollToBottom();
}

function appendSystemMessage(text, cls = '') {
  ensureChatNotEmpty();
  state.lastGroup = { cid: null, el: null, ts: 0 };

  const node = createEl('div', { className: `sys${cls ? ` ${cls}` : ''}` });
  node.appendChild(createEl('span', { text }));
  dom.messages.appendChild(node);
  maybeScrollToBottom();
}

/* ═══════════════════════════════════════════
   Scroll handling
═══════════════════════════════════════════ */
function handleMessageScroll() {
  const distanceFromBottom = dom.messages.scrollHeight - dom.messages.scrollTop - dom.messages.clientHeight;
  state.userScrolled = distanceFromBottom >= 80;
  dom.scrollBtn.classList.toggle('show', state.userScrolled);
}

function maybeScrollToBottom() {
  if (!state.userScrolled) scrollToBottom();
}

/* ═══════════════════════════════════════════
   Composer
═══════════════════════════════════════════ */
function handleMessageInput() {
  dom.msgInput.style.height = '34px';
  dom.msgInput.style.height = `${Math.min(dom.msgInput.scrollHeight, 110)}px`;
  syncSendButton();
}

function handleMessageKeydown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function sendMessage() {
  const text = dom.msgInput.value.trim();
  if (!text || !state.client?.connected) return;

  const body = normalizeText(text);
  appendMessage({ cid: state.me.cid, user: state.me.name, text: body, ts: Date.now(), self: true });
  publishPacket({ type: 'msg', user: state.me.name, text: body });

  dom.msgInput.value = '';
  dom.msgInput.style.height = '34px';
  dom.msgInput.focus();
  syncSendButton();
}

/* ═══════════════════════════════════════════
   Sharing / closing
═══════════════════════════════════════════ */
function copyRoomLink() {
  if (!state.room) return;
  const url = `${location.origin}${location.pathname}?room=${encodeURIComponent(state.room)}`;
  const done = () => toast('招待URLをコピーしました 🔗');

  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => {
      prompt('このURLをコピーして共有してください:', url);
    });
    return;
  }

  prompt('このURLをコピーして共有してください:', url);
}

function handleBeforeUnload() {
  if (state.client?.connected) {
    try {
      publishPacket({ type: 'leave', user: state.me.name });
      state.client.end(true);
    } catch {
      // Ignore shutdown issues.
    }
  }
}

/* ═══════════════════════════════════════════
   Boot
═══════════════════════════════════════════ */
init();
</script>
</body>
</html>
